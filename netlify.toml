# example netlify.toml
[build]
  command = "bun run build"
  functions = "netlify/functions"
  publish = "dist"

# Static files — force=true overrides SPA fallback
[[redirects]]
  from = "/download"
  to = "/download.html"
  status = 200
  force = true

[[redirects]]
  from = "/downloads/*"
  to = "/downloads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/firmware/*"
  to = "/firmware/:splat"
  status = 200
  force = true

# Force APK as download (phones try to render it as a page otherwise)
[[headers]]
  for = "/downloads/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment"

# Force firmware bin downloads
[[headers]]
  for = "/firmware/*.bin"
  [headers.values]
    Content-Disposition = "attachment"

# Home hidden for now — send / to the configurator (force overrides SPA fallback)
[[redirects]]
  from = "/"
  to = "/configurator"
  status = 302
  force = true

# SPA fallback — must be LAST
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

  ## (optional) Settings for Netlify Dev
  ## https://github.com/netlify/cli/blob/main/docs/netlify-dev.md#project-detection
  #[dev]
  #  command = "bun run dev" # Command to start your dev server
  #  port = 3000 # Port that the dev server will be listening on
  #  publish = "dist" # Folder with the static content for _redirect file

  ## more info on configuring this file: https://ntl.fyi/file-based-build-config
